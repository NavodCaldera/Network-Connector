[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.99"

# Shared dependency versions. Crates opt in with `foo.workspace = true`.
# Placeholders for Phase 0; uncomment and pin when first used.
[workspace.dependencies]
# thiserror = "2"
# anyhow = "1"
# tracing = "0.1"
# tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[workspace.lints.rust]
# AGENT.md §1 rule 11: no unsafe outside nc-exec / nc-identity platform adapters.
# Those crates may override this to `deny` + `// SAFETY:` comments later.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Smaller build cache, same runtime speed: keep line tables for our crates, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
