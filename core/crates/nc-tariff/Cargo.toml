[package]
name = "nc-tariff"
description = "Network tariff profiles, byte budgets, and the transfer window planner."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = "1.0.145"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
proptest = { workspace = true }

[lints]
workspace = true
