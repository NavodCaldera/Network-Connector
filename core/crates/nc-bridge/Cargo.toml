[package]
name = "nc-bridge"
description = "flutter_rust_bridge API surface: wraps the nc-agent API 1:1 for the Flutter app."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
# cdylib: loaded by the Flutter app (nc_bridge.dll / libnc_bridge.so). rlib: for `cargo test`.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
nc-agent = { path = "../nc-agent", version = "0.1.0" }
nc-policy = { path = "../nc-policy", version = "0.1.0" }
nc-tariff = { path = "../nc-tariff", version = "0.1.0" }
chrono = { version = "0.4.42", default-features = false, features = ["std", "now"] }
chrono-tz = "0.10.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Pinned exactly; must match `flutter_rust_bridge` in app/pubspec.yaml and the codegen CLI version.
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
