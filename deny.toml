# cargo-deny config for both workspaces (AGENT.md §1 rule 11).
# Run from repo root: cargo deny --manifest-path core/Cargo.toml check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained (not vulnerable); compile-time only, pulled in by libp2p via if-watch/netlink on Linux.
    # Remove when libp2p drops it. Accepted by the coordinator 2026-11-01.
    { id = "RUSTSEC-2024-0436", reason = "transitive via libp2p if-watch; unmaintained, no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is policy, not inventory: unused entries are fine.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Our own crates are publish = false; skip licence checks for them.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
