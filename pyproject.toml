[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-connector"
dynamic = ["version"]
description = "LAN distributed compute: a controller and outbound-only workers that share independent jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "psutil>=5.9",
  "pillow>=10.0",
  "cryptography>=42",
  "wasmtime==50.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
wifidirect = [
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Devices.WiFiDirect==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Security.Credentials==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration==3.2.1; sys_platform == 'win32'",
]
# The one app's background parts (PLAN §13): tray icon, messages, Wi-Fi radio and Wi-Fi network scans.
# pystray is LGPL-3.0, used unmodified as a separate library (owner approved, 2026-10-28).
app = [
  "pystray==0.19.5",
  "winrt-runtime==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Data.Xml.Dom==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Devices.Radios==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Devices.WiFi==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Networking==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Networking.Connectivity==3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Security.Credentials==3.2.1; sys_platform == 'win32'",
]

[project.scripts]
nc = "network_connector.cli:main"
nc-gui = "network_connector.gui:main"
nc-worker-gui = "network_connector.worker_gui:main"

[project.gui-scripts]
network-connector = "network_connector.app:main"
network-connector-worker = "network_connector.worker_gui:main"

[tool.setuptools.dynamic]
version = { attr = "network_connector.__version__" }

[tool.setuptools.packages.find]
include = ["network_connector*"]

[tool.setuptools.data-files]
"share/network_connector/scripts" = ["scripts/add-firewall-rule.ps1", "scripts/remove-firewall-rule.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running sandbox checks (still run by default)"]
