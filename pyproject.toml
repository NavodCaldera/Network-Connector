[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-connector"
dynamic = ["version"]
description = "LAN distributed compute: a controller and outbound-only workers that share independent jobs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "psutil>=5.9",
  "pillow>=10.0",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nc = "network_connector.cli:main"
nc-gui = "network_connector.gui:main"
nc-worker-gui = "network_connector.worker_gui:main"

[project.gui-scripts]
network-connector = "network_connector.gui:main"
network-connector-worker = "network_connector.worker_gui:main"

[tool.setuptools.dynamic]
version = { attr = "network_connector.__version__" }

[tool.setuptools.packages.find]
include = ["network_connector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
