name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (${{ matrix.os }}, ${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        workspace: [core, server]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain comes from rust-toolchain.toml (rustup on the runner reads it).
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ matrix.workspace }}
      - name: fmt
        working-directory: ${{ matrix.workspace }}
        run: cargo fmt --all --check
      - name: clippy
        working-directory: ${{ matrix.workspace }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        working-directory: ${{ matrix.workspace }}
        run: cargo test --all-targets --locked

  flutter:
    name: flutter (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.9
          channel: stable
      - name: pub get
        run: flutter pub get --enforce-lockfile
      - name: analyze
        run: flutter analyze
      # Widget tests use a fake agent; the Rust library is not loaded here.
      - name: test
        run: flutter test

  deny:
    name: cargo-deny (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [core, server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          arguments: --all-features
          command: check


  docker-stack:
    name: Docker stack (lease cycle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: nc-stack-${{ github.run_id }}-${{ github.run_attempt }}
      CARGO_TARGET_DIR: /tmp/nc-stack-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
          key: docker-stack-host
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Compose stack with GHA cache
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          # Compose requires these while parsing. Build-only placeholders are not runtime credentials.
          NC_PG_PASSWORD: unused-during-build
          NC_ENROLL_SECRET: unused-during-build
          NC_RELAY_TOKEN_KEY: unused-during-build
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          source: .
          files: infra/docker-compose.yml
          targets: |
            coordinator
            relay
          load: true
          set: |
            *.context=.
            *.dockerfile=infra/Dockerfile
            coordinator.cache-from=type=gha,scope=nc-stack-coordinator
            coordinator.cache-to=type=gha,mode=max,scope=nc-stack-coordinator
            relay.cache-from=type=gha,scope=nc-stack-relay
            relay.cache-to=type=gha,mode=max,scope=nc-stack-relay
      - name: Verify health, non-root services and lease cycle
        shell: bash
        run: bash infra/verify.sh --skip-build
      - name: Always clean up Compose stack
        if: ${{ always() }}
        shell: bash
        env:
          # Teardown only needs Compose parsing, not the discarded service credentials.
          NC_PG_PASSWORD: unused-during-cleanup
          NC_ENROLL_SECRET: unused-during-cleanup
          NC_RELAY_TOKEN_KEY: unused-during-cleanup
        run: |
          docker compose --project-name "$COMPOSE_PROJECT_NAME" \
            --file infra/docker-compose.yml down --volumes --remove-orphans
